name: crud-prod

services:
  db:
    build: ./db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/mysql
    healthcheck:
      # ต้องใช้ 127.0.0.1 (TCP) ไม่ใช่ localhost (socket): ตอนรัน init.sql MySQL จะเปิด server ชั่วคราวแบบ socket อย่างเดียว
      # ถ้า ping ผ่าน socket จะ "healthy" ก่อนสร้างตารางเสร็จ -> backend ต่อไม่ได้ได้ 500
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    # APP_VERSION มาจาก Jenkins (stage Release) -> image จะมี tag ตามเวอร์ชัน เช่น crud-backend:1.2.0
    image: crud-backend:${APP_VERSION:-latest}
    build:
      context: ./backend
      target: prod
    restart: always
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-dev}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: crud-frontend:${APP_VERSION:-latest}
    build:
      context: ./frontend
      target: prod
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db_data_prod:
